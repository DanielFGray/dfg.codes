services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: "${ROOT_DATABASE_USER:-postgres}"
      POSTGRES_PASSWORD: "${ROOT_DATABASE_PASSWORD:-postgres}"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
